<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FortiGate SD-WAN Lab Topology</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #080b15;
    color: #d1d5db;
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 1.5rem;
  }
  .container { max-width: 1500px; width: 100%; }
  h1 {
    font-size: 1.4rem; font-weight: 800; color: #e5e7eb;
    text-align: center; letter-spacing: -0.03em;
  }
  .subtitle {
    text-align: center; color: #6b7280; font-size: 0.75rem;
    margin-bottom: 1rem; font-family: 'JetBrains Mono', monospace;
  }
  svg { width: 100%; height: auto; display: block; }
  .mono { font-family: 'JetBrains Mono', monospace; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  @keyframes dash {
    to { stroke-dashoffset: -20; }
  }
  @keyframes dash-reverse {
    to { stroke-dashoffset: 20; }
  }
  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(99,102,241,0.6)); }
    50% { filter: drop-shadow(0 0 12px rgba(99,102,241,0.9)); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
</style>
</head>
<body>
<div class="container">
  <h1>FortiGate SD-WAN &bull; OVS Fabric Lab</h1>
